<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mike's EZ Standup</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest-worker.webmanifest">
<meta name="theme-color" content="#0e6170">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <nav class="tabs" role="tablist" aria-label="Worker portal">
    <button class="tab" role="tab" id="tab-send" aria-controls="view" aria-selected="true">Send Updates</button>
    <button class="tab" role="tab" id="tab-pending" aria-controls="view" aria-selected="false">Pending Requests <span class="count hidden" id="pending-count"></span></button>
    <button class="tab" role="tab" id="tab-messages" aria-controls="view" aria-selected="false">Messages <span class="count hidden" id="msg-count"></span></button>
    <button class="tab" role="tab" id="tab-history" aria-controls="view" aria-selected="false">My Updates</button>
  </nav>
  <section id="view" role="tabpanel"></section>
</main>
<footer class="app-footer" id="footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/worker.js"></script>
</body>
</html>
